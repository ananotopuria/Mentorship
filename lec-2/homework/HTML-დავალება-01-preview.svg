    <text x="70" y="515" font-size="17">All modern websites are built using HTML, CSS and JavaScript.</text>
    <text x="70" y="560" font-size="23" font-weight="700">What is HTML?</text><text x="70" y="592" font-size="17">HTML describes the structure and content of a web page.</text>
